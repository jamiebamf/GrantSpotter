<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | GrantSpotter</title><style>:root{--bg:#07111f;--panel:#0d1a2b;--text:#eef6ff;--muted:#8fa4bd;--line:#24364d;--blue:#47a7ff;--green:#31d39a;--red:#ff6b78}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#06101d,#0a1727 58%,#0e1b30);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.card{width:min(460px,100%);padding:30px;background:rgba(13,26,43,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.brand{font-size:27px;font-weight:900}.brand span{color:var(--blue)}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin-top:14px}.input{width:100%;border:1px solid var(--line);background:#081423;color:var(--text);border-radius:12px;padding:12px 13px}.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px 15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#268ae8,#5db7ff);cursor:pointer}.message{margin-top:14px;padding:11px 13px;border-radius:12px;background:#081423;border:1px solid var(--line)}.error{color:#ffabb3;border-color:#7e3340}.success{color:#9ef0d1;border-color:#246f58}a{color:#7bc0ff}</style></head><body><main class="card"><div class="brand">Grant<span>Spotter</span></div><h1>Create a new password</h1><p class="muted">Enter a new password for your customer account.</p><form id="resetForm"><div class="field"><label>New password</label><input id="password" class="input" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm new password</label><input id="confirm" class="input" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Update password</button></form><div id="message" class="message hidden"></div><p class="muted"><a href="/login">Return to sign in</a></p></main><script>const m=document.getElementById('message');function show(t,e=false){m.textContent=t;m.className='message '+(e?'error':'success')}function tokens(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));return{access:h.get('access_token')||q.get('access_token')||'',refresh:h.get('refresh_token')||q.get('refresh_token')||''}}document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(p!==c)return show('The passwords do not match.',true);const t=tokens();if(!t.access||!t.refresh)return show('This reset link is invalid or has expired. Request a new one from the sign-in page.',true);try{const r=await fetch('/api/customer/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:t.access,refresh_token:t.refresh,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Password reset failed');show(d.message);e.target.reset();setTimeout(()=>location.href='/login',1800)}catch(err){show(err.message,true)}};</script></body></html>
