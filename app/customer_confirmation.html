<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmed | GrantSpotter</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--text:#eef6ff;--muted:#8fa4bd;--line:#24364d;--blue:#47a7ff;--green:#31d39a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,rgba(71,167,255,.18),transparent 32%),linear-gradient(135deg,#06101d,#0a1727 58%,#0e1b30);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif}.card{width:min(560px,100%);padding:38px;background:rgba(13,26,43,.96);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.34);text-align:center}.brand{font-size:29px;font-weight:900;margin-bottom:28px}.brand span{color:var(--blue)}.icon{width:72px;height:72px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:rgba(49,211,154,.13);border:1px solid rgba(49,211,154,.45);color:var(--green);font-size:38px;font-weight:900}h1{margin:0 0 10px;font-size:32px;line-height:1.2}.muted{color:var(--muted);margin:0 auto 28px;max-width:430px}.btn{display:inline-block;padding:13px 22px;border-radius:13px;background:linear-gradient(135deg,#268ae8,#5db7ff);color:#fff;text-decoration:none;font-weight:800}.help{margin-top:24px;color:var(--muted);font-size:13px}.help a{color:#7bc0ff}
</style>
</head>
<body>
<main class="card">
<div class="brand">Grant<span>Spotter</span></div>
<div class="icon">✓</div>
<h1>Your email is confirmed</h1>
<p class="muted">Thank you for confirming your email address. Your GrantSpotter account is now ready and you can sign in to view your organisation profile and matched funding opportunities.</p>
<a class="btn" href="/login">Log in to your account</a>
<p class="help">Need help? Email <a href="mailto:info@grantspotter.co.uk">info@grantspotter.co.uk</a></p>
</main>
</body>
</html>
