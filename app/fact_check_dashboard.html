<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrantSpotter Fact Checker</title>
<style>
:root{--bg:#07111f;--panel:#0d1a2b;--line:#26384f;--text:#eef6ff;--muted:#92a6bd;--blue:#48a9ff;--green:#32d49a;--amber:#ffbc5b;--red:#ff6c79}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101d,#0b192a);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{margin:0}.muted{color:var(--muted)}.btn,input,select{font:inherit}.btn{border:0;border-radius:11px;padding:10px 14px;color:#fff;background:#1d3048;font-weight:750;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#268ae8,#5db7ff)}.btn.green{background:#11865f}.btn.ghost{border:1px solid var(--line);background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:rgba(13,26,43,.95);border:1px solid var(--line);border-radius:18px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line)}.input,.select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#081423;color:var(--text);margin-top:10px}.list{max-height:calc(100vh - 210px);overflow:auto}.grant{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.grant:hover,.grant.active{background:rgba(72,169,255,.08)}.grant .title{font-weight:800}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;text-transform:uppercase;font-weight:800;margin-top:7px}.review{background:rgba(255,188,91,.15);color:#ffd08a}.approved{background:rgba(50,212,154,.15);color:#78e8bb}.content{padding:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.card{padding:14px;border:1px solid var(--line);border-radius:14px;background:#0a1626}.big{font-size:22px;font-weight:850}.checks{display:grid;gap:10px}.check{display:grid;grid-template-columns:34px 160px 1fr 1fr 100px;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px}.check.confirmed{border-color:rgba(50,212,154,.35)}.check.incorrect{border-color:rgba(255,108,121,.45)}.check.missing,.check.uncertain{border-color:rgba(255,188,91,.4)}.value{white-space:pre-wrap;word-break:break-word}.evidence{color:#c6d4e3}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.empty{padding:50px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#14263c;border:1px solid var(--line);padding:12px 15px;border-radius:12px}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.list{max-height:320px}.check{grid-template-columns:30px 1fr}.check>div{grid-column:2}.summary{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Source-backed fact checker</h1><div class="muted">Compare saved grant data against a freshly fetched official page.</div></div><div><a class="btn ghost" href="/admin/dashboard" style="text-decoration:none">Back to dashboard</a></div></div>
  <div class="grid">
    <section class="panel"><div class="panel-head"><strong>Grants</strong><input id="search" class="input" placeholder="Search grants"><select id="status" class="select"><option value="review">Needs review</option><option value="">All statuses</option><option value="approved">Approved</option></select></div><div id="grantList" class="list"></div></section>
    <section class="panel"><div id="empty" class="empty">Choose a grant to run or view a fact check.</div><div id="detail" class="content hidden"><h2 id="title"></h2><div id="meta" class="muted"></div><div class="actions"><button id="runBtn" class="btn primary">Run fresh fact check</button><button id="acceptBtn" class="btn green" disabled>Accept selected corrections</button><button id="sourceBtn" class="btn ghost">Open official source</button></div><div id="summary" class="summary hidden"><div class="card"><div class="muted">Verdict</div><div id="verdict" class="big"></div></div><div class="card"><div class="muted">Confidence</div><div id="confidence" class="big"></div></div><div class="card"><div class="muted">Summary</div><div id="checkSummary"></div></div></div><div id="checks" class="checks"></div></div></section>
  </div>
</div><div id="toast" class="toast hidden"></div>
<script>
const key=sessionStorage.getItem('gs_admin_key')||'';if(!key)location.href='/admin/dashboard';
const state={grants:[],current:null,check:null};const $=s=>document.querySelector(s);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'X-Admin-Key':key,'Content-Type':'application/json'}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`Request failed (${r.status})`);return d}
function toast(m,e=false){const t=$('#toast');t.textContent=m;t.style.borderColor=e?'#8b3441':'';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
function text(v){if(v===null||v===undefined||v==='')return 'Not supplied';if(Array.isArray(v))return v.join('\n');if(typeof v==='object')return JSON.stringify(v,null,2);return String(v)}
async function load(){state.grants=await api('/admin/grants?limit=500');renderList()}
function filtered(){const q=$('#search').value.toLowerCase(),s=$('#status').value;return state.grants.filter(g=>(!s||g.verification_status===s)&&`${g.grant_title} ${g.funder_name}`.toLowerCase().includes(q))}
function renderList(){const box=$('#grantList');box.innerHTML='';for(const g of filtered()){const e=document.createElement('div');e.className='grant'+(state.current?.id===g.id?' active':'');e.innerHTML='<div class="title"></div><div class="muted funder"></div><span class="badge '+g.verification_status+'">'+g.verification_status+'</span>';e.querySelector('.title').textContent=g.grant_title;e.querySelector('.funder').textContent=g.funder_name;e.onclick=()=>selectGrant(g);box.appendChild(e)}}
async function selectGrant(g){state.current=g;state.check=null;renderList();$('#empty').classList.add('hidden');$('#detail').classList.remove('hidden');$('#title').textContent=g.grant_title;$('#meta').textContent=`${g.funder_name} · ${g.verification_status} · extraction confidence ${g.confidence_score}%`;$('#checks').innerHTML='';$('#summary').classList.add('hidden');$('#acceptBtn').disabled=true;try{const c=await api(`/admin/grants/${g.id}/fact-check`);if(c.status!=='not_run'){state.check=c;renderCheck()}}catch(e){toast(e.message,true)}}
function renderCheck(){const c=state.check;$('#summary').classList.remove('hidden');$('#verdict').textContent=c.overall_verdict.replaceAll('_',' ');$('#confidence').textContent=c.overall_confidence+'%';$('#checkSummary').textContent=c.summary;const box=$('#checks');box.innerHTML='';for(const f of c.fields){const row=document.createElement('div');row.className='check '+f.verdict;row.innerHTML='<input type="checkbox"><div><strong></strong><div class="badge '+(f.verdict==='confirmed'?'approved':'review')+'"></div></div><div><div class="muted">Current</div><div class="value current"></div></div><div><div class="muted">Suggested</div><div class="value suggested"></div><div class="muted" style="margin-top:8px">Evidence</div><div class="evidence"></div></div><div class="big score"></div>';row.querySelector('strong').textContent=f.field_name.replaceAll('_',' ');row.querySelector('.badge').textContent=f.verdict;row.querySelector('.current').textContent=text(f.current_value);row.querySelector('.suggested').textContent=text(f.suggested_value);row.querySelector('.evidence').textContent=f.evidence||'No direct evidence supplied';row.querySelector('.score').textContent=f.confidence+'%';const cb=row.querySelector('input');cb.dataset.field=f.field_name;cb.disabled=f.verdict==='confirmed'||f.accepted;cb.checked=!cb.disabled&&['incorrect','missing'].includes(f.verdict);cb.onchange=updateAccept;box.appendChild(row)}updateAccept()}
function updateAccept(){const selected=[...document.querySelectorAll('#checks input:checked')];$('#acceptBtn').disabled=!state.check||selected.length===0}
$('#runBtn').onclick=async()=>{if(!state.current)return;$('#runBtn').disabled=true;$('#runBtn').textContent='Checking official source…';try{state.check=await api(`/admin/grants/${state.current.id}/fact-check`,{method:'POST'});renderCheck();toast('Fact check completed')}catch(e){toast(e.message,true)}finally{$('#runBtn').disabled=false;$('#runBtn').textContent='Run fresh fact check'}};
$('#acceptBtn').onclick=async()=>{const fields=[...document.querySelectorAll('#checks input:checked')].map(x=>x.dataset.field);if(!fields.length)return;try{const r=await api(`/admin/grants/${state.current.id}/fact-check/${state.check.id}/accept`,{method:'POST',body:JSON.stringify({field_names:fields})});state.current=r.grant;state.check=r.fact_check;const i=state.grants.findIndex(g=>g.id===state.current.id);state.grants[i]=state.current;renderList();renderCheck();toast('Selected corrections applied')}catch(e){toast(e.message,true)}};
$('#sourceBtn').onclick=()=>state.current&&window.open(state.current.official_source_url||state.current.application_url,'_blank','noopener');$('#search').oninput=renderList;$('#status').onchange=renderList;load().catch(e=>toast(e.message,true));
</script>
</body></html>
